<!-- title: Contact | description: Get in touch with Recipe Secrets Restaurant - address, opening hours, phone, email and a contact form. -->
<section class="page-hero" style="--bg:url('{{imgurl:storefront:1800:900}}')">
  <div class="wrap"><p class="eyebrow eyebrow--light">Contact</p><h1>Say hello</h1><p>Questions, feedback or special occasions &mdash; we'd love to hear from you.</p></div>
</section>

<section class="section">
  <div class="wrap form-layout">
    <div class="info">
      <h2>Find us</h2>
      <h3>Address</h3><address>{{address}}</address>
      <h3>Phone</h3><p><a href="tel:{{phoneHref}}">{{phone}}</a></p>
      <h3>Email</h3><p><a href="mailto:{{email}}">{{email}}</a></p>
      <h3>Opening hours</h3>{{hours}}
      <p class="placeholder-note">Placeholder details &mdash; edit src/data/site.json</p>
    </div>
    <div class="form-card">
      <h2>Send a message</h2>
      <form id="contact-form" class="form" novalidate data-form="contact" data-subject="Website enquiry">
        <div class="row">
          <div class="field"><label for="c-name">Name <span aria-hidden="true">*</span></label><input id="c-name" name="name" type="text" autocomplete="name" required><p class="err" id="c-name-err" aria-live="polite"></p></div>
          <div class="field"><label for="c-email">Email <span aria-hidden="true">*</span></label><input id="c-email" name="email" type="email" autocomplete="email" required><p class="err" id="c-email-err" aria-live="polite"></p></div>
        </div>
        <div class="field"><label for="c-subject">Subject <span aria-hidden="true">*</span></label><input id="c-subject" name="subject" type="text" required><p class="err" id="c-subject-err" aria-live="polite"></p></div>
        <div class="field"><label for="c-message">Message <span aria-hidden="true">*</span></label><textarea id="c-message" name="message" rows="6" required></textarea><p class="err" id="c-message-err" aria-live="polite"></p></div>
        <button class="btn" type="submit">Send message</button>
        <div class="status" role="status" aria-live="polite" tabindex="-1"></div>
      </form>
    </div>
  </div>
</section>

<section class="section section--tint">
  <div class="wrap">
    <div class="section__head center"><p class="eyebrow">Directions</p><h2>Getting here</h2></div>
    <div class="map">{{map}}</div>
  </div>
</section>
